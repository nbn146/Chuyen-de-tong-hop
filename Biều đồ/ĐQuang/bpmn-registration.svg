<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 520" width="1260" height="520" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="40" y="32" font-size="18" font-weight="bold" fill="#0f172a">BPMN 2.0 — QUY TRÌNH ĐĂNG KÝ TÀI KHOẢN (USER REGISTRATION PROCESS)</text>
  <text x="40" y="52" font-size="12" fill="#64748b">Dự án: Hệ thống Website Bán hàng Trực tuyến ElectroTech | Chuẩn thiết kế BPMN nền trắng (Diagram Standard)</text>

  <!-- POOL CONTAINER -->
  <rect x="40" y="70" width="1180" height="420" rx="4" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
  
  <!-- Pool Header (Left vertical banner) -->
  <rect x="40" y="70" width="42" height="420" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" />
  <text x="-280" y="96" font-size="13" font-weight="bold" fill="#1e293b" transform="rotate(-90)" text-anchor="middle" letter-spacing="1">HỆ THỐNG BÁN HÀNG ELECTROTECH</text>

  <!-- SWIMLANE 1: KHÁCH HÀNG (CUSTOMER / GUEST) -->
  <rect x="82" y="70" width="1138" height="200" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  <rect x="82" y="70" width="34" height="200" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
  <text x="-170" y="103" font-size="12" font-weight="600" fill="#334155" transform="rotate(-90)" text-anchor="middle">Khách hàng (Guest)</text>

  <!-- SWIMLANE 2: HỆ THỐNG (SYSTEM / BACKEND) -->
  <rect x="82" y="270" width="1138" height="220" fill="#fafbfc" stroke="#94a3b8" stroke-width="1" />
  <rect x="82" y="270" width="34" height="220" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
  <text x="-380" y="103" font-size="12" font-weight="600" fill="#334155" transform="rotate(-90)" text-anchor="middle">Hệ thống (Web &amp; Server)</text>

  <!-- ==================== FLOW ELEMENTS ==================== -->

  <!-- 1. START EVENT -->
  <circle cx="150" cy="165" r="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" filter="url(#shadow)" />
  <text x="150" y="202" font-size="11" font-weight="600" fill="#166534" text-anchor="middle">Bắt đầu</text>

  <!-- Sequence: Start -> Task 1 -->
  <line x1="168" y1="165" x2="200" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 2. TASK 1: USER NHẬP FORM (User Lane) -->
  <g filter="url(#shadow)">
    <rect x="200" y="132" width="150" height="66" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <!-- User Icon -->
    <path d="M 212 144 a 4 4 0 1 0 8 0 a 4 4 0 1 0 -8 0 M 209 156 c 0 -3 3 -4 7 -4 c 4 0 7 1 7 4 z" fill="#3b82f6" />
    <text x="275" y="156" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Nhập thông tin</text>
    <text x="275" y="172" font-size="10" fill="#475569" text-anchor="middle">đăng ký tài khoản</text>
    <text x="275" y="186" font-size="9" fill="#64748b" text-anchor="middle">(Họ tên, Email, Mật khẩu...)</text>
  </g>

  <!-- Sequence: Task 1 -> Task 2 -->
  <line x1="350" y1="165" x2="385" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 3. TASK 2: BẤM ĐĂNG KÝ (User Lane) -->
  <g filter="url(#shadow)">
    <rect x="385" y="140" width="115" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <path d="M 397 151 a 4 4 0 1 0 8 0 a 4 4 0 1 0 -8 0 M 394 163 c 0 -3 3 -4 7 -4 c 4 0 7 1 7 4 z" fill="#3b82f6" />
    <text x="447" y="162" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Nhấn nút</text>
    <text x="447" y="177" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="middle">"Đăng ký"</text>
  </g>

  <!-- Sequence: Task 2 -> Task 3 (Crossing lane from Customer to System) -->
  <path d="M 442 190 L 442 340" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 4. TASK 3: VALIDATE DỮ LIỆU (System Lane) -->
  <g filter="url(#shadow)">
    <rect x="375" y="340" width="135" height="60" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
    <!-- Gear Icon -->
    <path d="M 390 355 l 2 -1 l 1 2 l 2 0 l 1 -2 l 2 1 l 0 2 l 2 1 l -1 2 l 1 2 l -2 1 l 0 2 l -2 1 l -1 -2 l -2 0 l -1 2 l -2 -1 l 0 -2 l -2 -1 l 1 -2 l -1 -2 l 2 -1 z" fill="#64748b" />
    <text x="442" y="367" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Kiểm tra hợp lệ</text>
    <text x="442" y="383" font-size="10" fill="#475569" text-anchor="middle">dữ liệu nhập (FE/BE)</text>
  </g>

  <!-- Sequence: Task 3 -> Gateway 1 -->
  <line x1="510" y1="370" x2="545" y2="370" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 5. GATEWAY 1: DỮ LIỆU HỢP LỆ? (System Lane) -->
  <g filter="url(#shadow)">
    <polygon points="570,348 592,370 570,392 548,370" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" />
    <text x="570" y="375" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">×</text>
    <text x="570" y="410" font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">Hợp lệ?</text>
  </g>

  <!-- Gateway 1 -> [Không hợp lệ] Loop back to User form -->
  <path d="M 570 348 L 570 240 L 275 240 L 275 198" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-error)" />
  <rect x="525" y="270" width="76" height="20" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
  <text x="563" y="284" font-size="9.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">Không hợp lệ</text>
  <text x="365" y="234" font-size="9.5" fill="#dc2626" font-weight="600">Báo lỗi: Sai định dạng / MK không khớp</text>

  <!-- Gateway 1 -> [Hợp lệ] -> Task 4 -->
  <line x1="592" y1="370" x2="635" y2="370" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="595" y="354" width="34" height="15" rx="3" fill="#dcfce7" />
  <text x="612" y="365" font-size="9.5" font-weight="bold" fill="#15803d" text-anchor="middle">Có</text>

  <!-- 6. TASK 4: CHECK EMAIL ĐÃ TỒN TẠI (System Lane) -->
  <g filter="url(#shadow)">
    <rect x="635" y="340" width="135" height="60" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
    <path d="M 650 355 l 2 -1 l 1 2 l 2 0 l 1 -2 l 2 1 l 0 2 l 2 1 l -1 2 l 1 2 l -2 1 l 0 2 l -2 1 l -1 -2 l -2 0 l -1 2 l -2 -1 l 0 -2 l -2 -1 l 1 -2 l -1 -2 l 2 -1 z" fill="#64748b" />
    <text x="702" y="367" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Kiểm tra Email</text>
    <text x="702" y="383" font-size="10" fill="#475569" text-anchor="middle">trong CSDL (SQL)</text>
  </g>

  <!-- Sequence: Task 4 -> Gateway 2 -->
  <line x1="770" y1="370" x2="805" y2="370" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 7. GATEWAY 2: EMAIL ĐÃ TỒN TẠI? (System Lane) -->
  <g filter="url(#shadow)">
    <polygon points="830,348 852,370 830,392 808,370" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" />
    <text x="830" y="375" font-size="14" font-weight="bold" fill="#b45309" text-anchor="middle">×</text>
    <text x="830" y="410" font-size="10" font-weight="600" fill="#92400e" text-anchor="middle">Đã tồn tại?</text>
  </g>

  <!-- Gateway 2 -> [Đã tồn tại] Loop back to User form -->
  <path d="M 830 348 L 830 220 L 310 220 L 310 198" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-error)" />
  <rect x="788" y="260" width="70" height="20" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" />
  <text x="823" y="274" font-size="9.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">Đã tồn tại</text>
  <text x="560" y="214" font-size="9.5" fill="#dc2626" font-weight="600">Báo lỗi: "Email này đã được sử dụng"</text>

  <!-- Gateway 2 -> [Chưa tồn tại] -> Task 5 -->
  <line x1="852" y1="370" x2="890" y2="370" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="855" y="354" width="32" height="15" rx="3" fill="#dcfce7" />
  <text x="871" y="365" font-size="9.5" font-weight="bold" fill="#15803d" text-anchor="middle">Chưa</text>

  <!-- 8. TASK 5: HASH PW VÀ TẠO USER (System Lane) -->
  <g filter="url(#shadow)">
    <rect x="890" y="338" width="145" height="64" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
    <path d="M 905 352 l 2 -1 l 1 2 l 2 0 l 1 -2 l 2 1 l 0 2 l 2 1 l -1 2 l 1 2 l -2 1 l 0 2 l -2 1 l -1 -2 l -2 0 l -1 2 l -2 -1 l 0 -2 l -2 -1 l 1 -2 l -1 -2 l 2 -1 z" fill="#64748b" />
    <text x="965" y="361" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Mã hóa mật khẩu</text>
    <text x="965" y="375" font-size="10" fill="#475569" text-anchor="middle">(BCrypt Hash) &amp; Lưu</text>
    <text x="965" y="390" font-size="9" fill="#16a34a" font-weight="bold" text-anchor="middle">User (Role: Customer)</text>
  </g>

  <!-- Sequence: Task 5 -> Task 6 -->
  <path d="M 965 338 L 965 198" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 9. TASK 6: THÔNG BÁO VÀ CHUYỂN TRANG (User Lane) -->
  <g filter="url(#shadow)">
    <rect x="895" y="135" width="140" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="965" y="159" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Thông báo đăng ký</text>
    <text x="965" y="174" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">thành công (Toast)</text>
    <text x="965" y="188" font-size="9" fill="#64748b" text-anchor="middle">Chuyển sang trang Login</text>
  </g>

  <!-- Sequence: Task 6 -> End Event -->
  <line x1="1035" y1="165" x2="1080" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 10. END EVENT -->
  <circle cx="1100" cy="165" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3.5" filter="url(#shadow)" />
  <circle cx="1100" cy="165" r="13" fill="none" stroke="#dc2626" stroke-width="1" />
  <text x="1100" y="202" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">Kết thúc</text>

  <!-- LEGEND -->
  <g transform="translate(60, 465)">
    <text x="0" y="15" font-size="11" font-weight="bold" fill="#475569">Chú thích chuẩn BPMN 2.0:</text>
    <circle cx="160" cy="11" r="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text x="175" y="15" font-size="10" fill="#334155">Start Event</text>

    <circle cx="260" cy="11" r="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" />
    <text x="275" y="15" font-size="10" fill="#334155">End Event</text>

    <rect x="350" y="4" width="22" height="14" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <text x="380" y="15" font-size="10" fill="#334155">User Task</text>

    <rect x="450" y="4" width="22" height="14" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
    <text x="480" y="15" font-size="10" fill="#334155">Service Task</text>

    <polygon points="570,4 578,11 570,18 562,11" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" />
    <text x="586" y="15" font-size="10" fill="#334155">Exclusive Gateway (XOR)</text>
  </g>
</svg>
